name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          # One retry: publishing is a one-shot event, so a transient failure while resolving
          # NeoForge or Parchment would otherwise mean re-running the release by hand.
          ./gradlew build || { echo "Build failed, retrying once after 60s"; sleep 60; ./gradlew build; }

      - name: Publish to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # CurseForge
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Modrinth
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Mod details
          name: MCHelden ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          # Kept in step with minecraft_version_range in gradle.properties, which is [1.21.1].
          game-versions: |
            1.21.1
          loaders: neoforge
          version-type: release
          java: 21
          files: build/libs/!(*-sources).jar

      - name: Upload jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/!(*-sources).jar
